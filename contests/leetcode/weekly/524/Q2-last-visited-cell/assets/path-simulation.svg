<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Directional grid simulation flow</title>
  <desc id="desc">A four-cell path moves right, down, then left, and stops before revisiting the starting cell.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="800" height="360" rx="20" fill="#f8fafc"/>
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Follow the arrow; stop before an invalid move</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(150 100)">
      <rect width="150" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="38" font-size="17" font-weight="700" fill="#1e3a8a">(0, 0) · R</text>
      <text x="75" y="65" font-size="14" fill="#1e40af">visited #1</text>
    </g>
    <g transform="translate(500 100)">
      <rect width="150" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="38" font-size="17" font-weight="700" fill="#1e3a8a">(0, 1) · D</text>
      <text x="75" y="65" font-size="14" fill="#1e40af">visited #2</text>
    </g>
    <g transform="translate(500 240)">
      <rect width="150" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="38" font-size="17" font-weight="700" fill="#1e3a8a">(1, 1) · L</text>
      <text x="75" y="65" font-size="14" fill="#1e40af">visited #3</text>
    </g>
    <g transform="translate(150 240)">
      <rect width="150" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="75" y="38" font-size="17" font-weight="700" fill="#14532d">(1, 0) · U</text>
      <text x="75" y="65" font-size="14" fill="#166534">answer · visited #4</text>
    </g>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)">
    <path d="M305 145 H490"/>
    <path d="M575 195 V230"/>
    <path d="M495 285 H310"/>
  </g>
  <path d="M225 235 V200 Q225 175 250 175" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 7"/>
  <circle cx="250" cy="175" r="8" fill="#dc2626"/>
  <text x="330" y="215" font-family="system-ui, sans-serif" font-size="15" fill="#991b1b">stop: (0, 0) was visited</text>
</svg>
